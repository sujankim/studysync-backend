name: Build & Deploy StudySync API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # PRs: run tests + build only (don't deploy)

# ── Environment Variables ──────────────────────────────────────────
env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/studysync-api

jobs:

  # ════════════════════════════════════════════════════════════════
  # JOB 1: Test and Build
  # Runs on every push AND every pull request
  # ════════════════════════════════════════════════════════════════
  build-and-test:
    name: Test and Build
    runs-on: ubuntu-latest
    # ubuntu-latest = free Linux VM provided by GitHub

    steps:

      # ── Step 1: Get the code ──────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v5
        # Downloads your repository code onto the runner VM

      # ── Step 2: Install Java 21 ───────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          # cache: 'maven' = cache downloaded dependencies
          # Second run: Maven doesn't re-download → faster builds

      # ── Step 3: Run Tests ─────────────────────────────────────
      - name: Run tests
        run: mvn test -B
        # -B = batch mode (no interactive prompts)
        # If any test fails → this step fails
        # Failed step → job fails → deployment BLOCKED ✅
        env:
          SPRING_PROFILES_ACTIVE: test
          # Tests need some env vars to not fail on missing config
          JWT_SECRET: test-secret-key-for-ci-only-not-real
          GEMINI_API_KEY: test-key
          GOOGLE_CLIENT_ID: test-id
          GOOGLE_CLIENT_SECRET: test-secret
          DATABASE_URL: jdbc:h2:mem:testdb
          DATABASE_USERNAME: sa
          DATABASE_PASSWORD: ""

      # ── Step 4: Build JAR ─────────────────────────────────────
      - name: Build JAR
        run: mvn package -DskipTests -B
        # -DskipTests = skip tests (already ran above)
        # Produces: target/ChatBot-0.0.1-SNAPSHOT.jar

      # ── Step 5: Login to Docker Hub ───────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # ${{ secrets.X }} = reads from GitHub Secrets (safe, never logged)

      # ── Step 6: Build and Push Docker Image ───────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # push only when on main branch (not on PRs)
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          # Two tags:
          # :latest    → always newest (Render uses this)
          # :abc1234   → exact commit hash (never changes, use for rollback)

  # ════════════════════════════════════════════════════════════════
  # JOB 2: Deploy to Render
  # Only runs when:
  #   1. build-and-test succeeded (needs:)
  #   2. We're on main branch (if:)
  # Pull Requests NEVER reach this job
  # ════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-test
    # needs: = "only run this job if build-and-test passed"
    if: github.ref == 'refs/heads/main'
    # if: = "only run on main branch, not on PRs"

    steps:

      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deploy triggered on Render"
        # Render sees this webhook → pulls latest Docker image → redeploys
        # Takes ~5 minutes to complete