# H2 in-memory DB for CI tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mail config for tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

# Disable OAuth2 for tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test

# Dummy values for tests
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-testing
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000
app.frontend-url=http://localhost:4200
app.cloudinary.cloud-name=test
app.cloudinary.api-key=test
app.cloudinary.api-secret=test
app.khalti.secret-key=test
app.khalti.initiate-url=https://dev.khalti.com/api/v2/epayment/initiate/
app.khalti.lookup-url=https://dev.khalti.com/api/v2/epayment/lookup/
app.khalti.return-url=http://localhost:8080/api/payment/callback
app.khalti.website-url=http://localhost:4200

app.backend-url=http://localhost:8080