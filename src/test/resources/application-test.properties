# Test profile — H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable OAuth2 for tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

# Dummy app props for tests
app.jwt.secret=test-secret-key-that-is-long-enough-for-testing-purposes
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000
app.frontend-url=http://localhost:4200